name: Browser edition
on:
  push:
    branches: [main, feat/web-platform, feat/real-time-warfare, feat/visual-overhaul, feat/command-expansion]
  pull_request:
    paths:
      - 'echelon/**'
      - 'web/**'
      - 'tests/**'
      - 'requirements-web.txt'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/web.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-web.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -p test_web_api.py -q
      - run: python -m unittest discover -s tests -p test_battle.py -q
      - run: python -m unittest discover -s tests -p test_command.py -q
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/test_command_v4.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-web.txt
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: python -m uvicorn echelon.web_api:app --host 127.0.0.1 --port 8000 > /tmp/echelon.log 2>&1 &
        working-directory: .
      - run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          cat /tmp/echelon.log
          exit 1
        working-directory: .
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t echelon-web:ci .
      - run: docker run -d --name echelon-ci -p 10000:10000 echelon-web:ci
      - run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/health; then
              curl -fsS http://127.0.0.1:10000/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs echelon-ci
          exit 1
